<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ribera del Marco - Olimpo II - Transversal Turismo y Diseño</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js",
                "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/loaders/GLTFLoader.js",
                "three/examples/jsm/loaders/DRACOLoader.js": "https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/loaders/DRACOLoader.js",
                "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/controls/OrbitControls.js"
            }
        }
    </script>
</head>

<body>
    <div id="loading">
        <div id="loading-text">Cargando modelo 3D...</div>
        <div id="loading-bar-container">
            <div id="loading-bar"></div>
        </div>
    </div>

    <!-- UI Overlay Layer -->
    <div id="ui-layer" style="z-index: 5;">


        <!-- Watermark -->
        <div id="watermark">Francisco José Bermejo Tarifa - Diseño Gráfico Olimpo II - 2026</div>
    </div>


    <div id="canvas-container"></div>

    <!-- UI Overlay Top Layer (Guaranteed to be above map labels) -->
    <!-- Floating Reset Button -->
    <button id="reset-view-btn" class="glass-btn primary-btn" style="z-index: 9999 !important;">Restablecer Vista</button>


    <!-- Detailed Side Panel (Hidden by default) -->
    <div id="detail-panel" class="glass-panel hidden" style="z-index: 9999 !important;">
        <h2 id="detail-title">Landmark Title</h2>
        <p id="detail-desc">Full landmark description goes here.</p>
        <div id="detail-extra-info">
            <span>Tipo: <strong id="detail-type">Unknown</strong></span>
            <span>Demarcación: <strong id="detail-titu">Unknown</strong></span>
        </div>
        <button id="open-pdf-btn" class="glass-btn primary-btn"
            style="width: 100%; margin-bottom: 10px; display: none;">Información detallada</button>
        <div class="panel-nav-buttons" style="display: flex; justify-content: space-between; gap: 10px;">
            <button id="prev-landmark-btn" class="glass-btn" title="localización previa"
                style="flex: 1; font-weight: bold;">&lt;</button>
            <button id="close-panel-btn" class="glass-btn" title="salir"
                style="flex: 1; font-weight: bold;">X</button>
            <button id="next-landmark-btn" class="glass-btn" title="siguiente localización"
                style="flex: 1; font-weight: bold;">&gt;</button>
        </div>
    </div>

    <!-- PDF Frame Modal (Moved outside ui-layer to cover map labels) -->
    <div id="pdf-modal" class="hidden" style="z-index: 10000 !important;">
        <button id="close-pdf-btn" class="glass-btn">X</button>
        <iframe id="pdf-frame" src=""></iframe>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
