<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ribera del Marco - Olimpo II - Transversal Turismo y Diseño</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js",
                "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/loaders/GLTFLoader.js",
                "three/examples/jsm/loaders/DRACOLoader.js": "https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/loaders/DRACOLoader.js",
                "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/controls/OrbitControls.js"
            }
        }
    </script>
</head>

<body>
    <div id="loading">Cargando vista...</div>

    <!-- UI Overlay Layer -->
    <div id="ui-layer">
        <!-- Floating Reset Button -->
        <button id="reset-view-btn" class="glass-btn primary-btn">Restablecer Vista</button>

        <!-- Detailed Side Panel (Hidden by default) -->
        <div id="detail-panel" class="glass-panel hidden">
            <h2 id="detail-title">Landmark Title</h2>
            <p id="detail-desc">Full landmark description goes here.</p>
            <div id="detail-extra-info">
                <span>Tipo: <strong id="detail-type">Unknown</strong></span>
                <span>Titularidad: <strong id="detail-titu">Unknown</strong></span>
            </div>
            <button id="close-panel-btn" class="glass-btn">Cerrar Panel</button>
        </div>

        <!-- Hover Info Card (Hidden by default, attaches to cursor or button) -->
        <div id="hover-card" class="glass-panel hidden">
            <h3 id="hover-title">Title</h3>
            <p id="hover-desc">Short description.</p>
        </div>

        <!-- Bottom Navigation Bar -->
        <div id="nav-bar" class="glass-panel">
            <button class="landmark-btn glass-btn" data-id="0">Charca del Marco</button>
            <button class="landmark-btn glass-btn" data-id="1">Fuente Fría</button>
            <button class="landmark-btn glass-btn" data-id="2">Fuente Concejo</button>
            <button class="landmark-btn glass-btn" data-id="3">Fuente Rocha</button>
            <button class="landmark-btn glass-btn" data-id="4">Abrevaderos del Vadillo</button>
        </div>

        <!-- CAD Cursor Crosshair -->
        <div id="crosshair-x"></div>
        <div id="crosshair-y"></div>

        <!-- Map Coordinates Tooltip -->
        <div id="coords-tooltip">
            <span class="coords-label">X:</span><span id="coord-x" class="coords-val">0.00</span>
            <span class="coords-label" style="margin-left: 10px;">Y:</span><span id="coord-y"
                class="coords-val">0.00</span>
        </div>

        <!-- Watermark -->
        <div id="watermark">Francisco José Bermejo Tarifa - Diseño Gráfico Olimpo II - 2026</div>
    </div>


    <div id="canvas-container"></div>
    <script type="module" src="main.js"></script>
</body>

</html>
