<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Aplicación Rutas de Turismo Olimpo II — Presentación</title>
  <link rel="stylesheet" href="../../vendor/fonts/inter.css">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/carousel-viewer.css">
</head>
<body>
  <section class="carousel" aria-roledescription="carrusel" aria-label="Aplicación Rutas de Turismo Olimpo II">
    <div class="carousel-controls">
      <button type="button" data-direction="previous" aria-label="Lámina anterior">
        <span aria-hidden="true">&#8249;</span>
      </button>
      <button type="button" data-direction="next" aria-label="Siguiente lámina">
        <span aria-hidden="true">&#8250;</span>
      </button>
    </div>

    <div class="carousel-track" tabindex="0" role="group" aria-label="Láminas de la presentación">
      <figure class="carousel-slide" role="group" aria-roledescription="diapositiva" aria-label="1 de 8" data-marker-name="Ir a la lámina 1: Portada">
        <img src="0slides_APP_Rutas_Turismo.png" alt="Portada: Aplicación Rutas de Turismo Olimpo II, septiembre 2026" decoding="async">
      </figure>
      <figure class="carousel-slide" role="group" aria-roledescription="diapositiva" aria-label="2 de 8" data-marker-name="Ir a la lámina 2: Explorar">
        <img src="1slides_APP_Rutas_Turismo.png" alt="Primer acceso al mapa, con la invitación a explorar las rutas" decoding="async">
      </figure>
      <figure class="carousel-slide" role="group" aria-roledescription="diapositiva" aria-label="3 de 8" data-marker-name="Ir a la lámina 3: Rutas">
        <img src="2slides_APP_Rutas_Turismo.png" alt="Panel de rutas abierto y trazado de la ruta seleccionada en el mapa" decoding="async">
      </figure>
      <figure class="carousel-slide" role="group" aria-roledescription="diapositiva" aria-label="4 de 8" data-marker-name="Ir a la lámina 4: Punto de interés">
        <img src="3slides_APP_Rutas_Turismo.png" alt="Punto de interés con su etiqueta y el panel de descripción" decoding="async">
      </figure>
      <figure class="carousel-slide" role="group" aria-roledescription="diapositiva" aria-label="5 de 8" data-marker-name="Ir a la lámina 5: Ficha">
        <img src="4slides_APP_Rutas_Turismo.png" alt="Ficha completa de la ruta Ribera del Marco y Sendero a la Montaña" decoding="async">
      </figure>
      <figure class="carousel-slide" role="group" aria-roledescription="diapositiva" aria-label="6 de 8" data-marker-name="Ir a la lámina 6: Acceso">
        <img src="5slides_APP_Rutas_Turismo.png" alt="Acceso al panel de administración de rutas" decoding="async">
      </figure>
      <figure class="carousel-slide" role="group" aria-roledescription="diapositiva" aria-label="7 de 8" data-marker-name="Ir a la lámina 7: Publicar">
        <img src="6slides_APP_Rutas_Turismo.png" alt="Panel de administración para cargar el GeoJSON y publicar la ruta" decoding="async">
      </figure>
      <figure class="carousel-slide" role="group" aria-roledescription="diapositiva" aria-label="8 de 8" data-marker-name="Ir a la lámina 8: Móvil">
        <img src="7slides_APP_Rutas_Turismo.png" alt="La misma aplicación adaptada a la pantalla del móvil" decoding="async">
      </figure>
    </div>

    <p class="visually-hidden" role="status" aria-live="polite"></p>

    <div class="carousel-hud">
      <div class="carousel-meta">
        <span class="carousel-counter" data-carousel-counter aria-hidden="true">1 / 8</span>
        <span class="carousel-caption" data-carousel-caption>Portada: Aplicación Rutas de Turismo Olimpo II, septiembre 2026</span>
      </div>
      <nav class="carousel-markers" aria-label="Elegir lámina"></nav>
    </div>
  </section>

  <script type="module" src="../../js/carousel-viewer.js"></script>
</body>
</html>
