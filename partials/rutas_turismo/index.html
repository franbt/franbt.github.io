<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no">
  <script>
    (function () {
      if (window.top === window || !window.frameElement) return;
      var w = window.frameElement.clientWidth;
      var h = window.frameElement.clientHeight;
      if (!w || !h) return;
      var meta = document.querySelector('meta[name="viewport"]');
      if (meta) {
        meta.setAttribute('content', 'width=' + w + ', initial-scale=1, viewport-fit=cover, shrink-to-fit=no');
      }
    })();
  </script>
  <meta name="description" content="Catálogo de rutas turísticas de ESCÁCERES.">
  <meta name="theme-color" content="#059669">
  <title>Rutas Turísticas</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-wrapper">
    <header class="site-header">
      <div class="header-inner">
        <div class="brand-wrapper" onclick="window.RutasApp.showCatalog()" role="button" tabindex="0" aria-label="Volver al catálogo">
          <div class="brand-logo-container">
            <img src="assets/logo-landscape.svg" alt="ESCÁCERES" class="escaceres-svg-logo">
          </div>
          <div class="brand-titles">
            <h1>Rutas Turísticas</h1>
          </div>
        </div>

        <div class="header-actions">
          <button class="header-btn" id="theme-toggle-btn" title="Cambiar tema" aria-label="Cambiar tema">
            <span class="icon">🌙</span><span class="theme-btn-text">Modo Oscuro</span>
          </button>
        </div>
      </div>
    </header>

    <main class="content-wrapper" id="main-content-wrapper">
      <section class="catalog-section" id="catalog-section">
        <div class="catalog-header">
          <h2 class="catalog-title">Rutas</h2>
        </div>

        <div class="filter-bar">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="search" id="search-routes-input" class="search-input" placeholder="Buscar por nombre, temática o parada" aria-label="Buscar rutas">
          </div>

          <div class="filter-pills">
            <button class="filter-pill theme-filter-pill active" data-theme="all">Todas</button>
            <button class="filter-pill theme-filter-pill" data-theme="Patrimonio"><strong style="color: #d15e15;">ES</strong>HISTORIA</button>
            <button class="filter-pill theme-filter-pill" data-theme="Ecoturismo"><strong style="color: #94c11f;">ES</strong>NATURALEZA</button>
            <button class="filter-pill theme-filter-pill" data-theme="Esencia"><strong style="color: #ab182d;">ES</strong>ESENCIA</button>
            <button class="filter-pill theme-filter-pill" data-theme="Paisaje"><strong style="color: #0098d6;">ES</strong>PAISAJE</button>
          </div>

          <div class="filter-pills">
            <button class="filter-pill diff-filter-pill active" data-diff="all">Dificultad</button>
            <button class="filter-pill diff-filter-pill" data-diff="Baja">Baja</button>
            <button class="filter-pill diff-filter-pill" data-diff="Media">Media</button>
          </div>
        </div>

        <div class="routes-grid" id="routes-catalog-grid"></div>
      </section>

      <div id="route-detail-container" style="display: none;"></div>
    </main>
  </div>

  <script src="js/routes-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
